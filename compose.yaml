services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opedu}
      POSTGRES_USER: ${POSTGRES_USER:-opedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opedu-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./mechlab
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-docker-development-key}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-opedu}:${POSTGRES_PASSWORD:-opedu-development}@postgres:5432/${POSTGRES_DB:-opedu}
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 mechlab.asgi:application"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - ./mechlab:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_BACKEND_ORIGIN: http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  redis_data:
  media_data:
  frontend_node_modules:
