name: Deploy

# Builds the OPedu images, pushes them to GitHub Container Registry and deploys them to the VPS.
#
# Runs automatically when CI passes on main. Run it by hand ("Run workflow") to redeploy, or to
# roll back by giving the full commit sha of an earlier deploy: its images are reused, nothing
# is rebuilt.
#
# Repository secrets (Settings → Secrets and variables → Actions), set once:
#   OPEDU_SSH_HOST         the server's address
#   OPEDU_SSH_USER         deploy
#   OPEDU_SSH_KEY          private key whose public half is in the deploy user's authorized_keys
#   OPEDU_SSH_KNOWN_HOSTS  the server's host key line(s), from `ssh-keyscan <host>`
# See deploy/README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit sha of an earlier deploy to roll back to (empty builds and deploys the selected branch)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# One deploy at a time; a newer one waits rather than cancelling a half-finished one.
concurrency:
  group: opedu-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/patience-izere/opedu-backend
  WEB_IMAGE: ghcr.io/patience-izere/opedu-web
  DEPLOY_PATH: /opt/opedu

jobs:
  build:
    name: Build and push images
    # Only after a green CI run on a push to main, or when started by hand without a rollback tag.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Choose the commit
        id: tag
        run: echo "tag=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Reject injected or disguised code before building anything
        run: python3 tools/check_repository_integrity.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: ./mechlab
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.title=opedu-backend
          cache-from: type=gha,scope=opedu-backend
          cache-to: type=gha,mode=max,scope=opedu-backend

      - name: Build and push the web front end
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          build-args: |
            VITE_RELEASE_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.title=opedu-web
          cache-from: type=gha,scope=opedu-web
          cache-to: type=gha,mode=max,scope=opedu-web

  deploy:
    name: Deploy to the VPS
    needs: build
    # Runs after a build, or on its own for a rollback to an existing tag.
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://opedu.izere.work
    steps:
      - name: Choose the images
        id: tag
        env:
          ROLLBACK_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          tag="${ROLLBACK_TAG:-$BUILT_TAG}"
          if ! echo "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Expected a full 40-character commit sha, got '$tag'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          sparse-checkout: deploy

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.OPEDU_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OPEDU_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Pasting a key into the secrets page can add Windows line endings or stray spaces.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/opedu_deploy
          chmod 600 ~/.ssh/opedu_deploy
          if ! ssh-keygen -y -f ~/.ssh/opedu_deploy > /dev/null 2>&1; then
            echo "::error::OPEDU_SSH_KEY is not a usable private key. Paste the whole private key file, from '-----BEGIN OPENSSH PRIVATE KEY-----' to '-----END OPENSSH PRIVATE KEY-----', keeping its line breaks (not the .pub file)."
            exit 1
          fi
          # Public information: compare it with the key in the deploy user's authorized_keys.
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/opedu_deploy | cut -d' ' -f2)"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Key only: never fall back to a password, and fail fast instead of prompting.
          cat > ~/.ssh/config <<'CONFIG'
          Host *
            IdentityFile ~/.ssh/opedu_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Check the server accepts the deploy key
        env:
          HOST: ${{ secrets.OPEDU_SSH_HOST }}
          USER: ${{ secrets.OPEDU_SSH_USER }}
        run: |
          if ! ssh "$USER@$HOST" true; then
            echo "::error::The server refused the deploy key. Add the public key to /home/$USER/.ssh/authorized_keys on the server (see deploy/README.md), and check OPEDU_SSH_USER and OPEDU_SSH_HOST."
            exit 1
          fi

      - name: Copy the deployment files
        env:
          HOST: ${{ secrets.OPEDU_SSH_HOST }}
          USER: ${{ secrets.OPEDU_SSH_USER }}
        run: |
          scp deploy/docker-compose.yml deploy/deploy.sh deploy/site.caddy deploy/.env.example \
            "$USER@$HOST:$DEPLOY_PATH/"

      - name: Deploy
        env:
          HOST: ${{ secrets.OPEDU_SSH_HOST }}
          USER: ${{ secrets.OPEDU_SSH_USER }}
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job's own token logs the server in to pull the images, and expires with the job;
          # the server keeps no registry credentials afterwards.
          printf '%s' "$REGISTRY_TOKEN" | ssh "$USER@$HOST" "set -e
              docker login $REGISTRY -u '$REGISTRY_USER' --password-stdin
              trap 'docker logout $REGISTRY >/dev/null' EXIT
              IMAGE_TAG='$TAG' sh $DEPLOY_PATH/deploy.sh"

      - name: Check the site answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://opedu.izere.work/api/v1/health/live/; then
              echo; exit 0
            fi
            sleep 10
          done
          echo "::warning::https://opedu.izere.work did not answer. If DNS is not set up yet, deploy.sh left the site unpublished."

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/opedu_deploy ~/.ssh/config
