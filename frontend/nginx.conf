# Keep the scheme set by a TLS-terminating load balancer; fall back to this server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Room for a 25 MB 3D asset upload plus form overhead; nginx otherwise rejects at 1 MB.
    client_max_body_size 26m;

    # Most learners are on mobile data, so compress everything that compresses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml model/gltf+json;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"opedu-web"}';
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # Vite names built assets by content hash, so they can be cached for good. `expires` keeps
    # the security headers above, which an add_header here would discard.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ~ ^/(api|admin|media|static)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
